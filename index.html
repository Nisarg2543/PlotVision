<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlotVision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; user-select:none; }
    .app-body { display:flex; flex:1; overflow:hidden; }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header id="topbar"></header>

  <div class="app-body">

    <!-- Left panel -->
    <aside id="left-panel"></aside>

    <!-- Canvas -->
    <main id="canvas-container" style="flex:1;position:relative;overflow:hidden;background:var(--color-bg);">
      <canvas id="main-canvas"   style="position:absolute;inset:0;display:block;"></canvas>
      <canvas id="overlay-canvas" style="position:absolute;inset:0;pointer-events:none;display:block;"></canvas>

      <div id="drop-overlay" style="display:none;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 12-4-4m4 4 4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>
        <p style="font-size:14px;font-weight:600;color:var(--color-accent);">Drop to load</p>
        <p style="font-size:11px;color:var(--color-text-2);">PNG · JPG · PDF · SVG · WebP</p>
      </div>

      <div id="empty-state">
        <div class="empty-icon">📊</div>
        <p class="empty-title">No image loaded</p>
        <p class="empty-sub">Drag & drop a chart, paste from clipboard (Ctrl+V), or open a file below</p>
        <button class="empty-open-btn" id="empty-open-btn">Open File</button>
      </div>
    </main>

    <!-- Right panel -->
    <aside id="right-panel">
      <div class="panel-tabs" id="panel-tabs"></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

  </div>

  <!-- Status bar -->
  <footer id="status-bar">
    <span>x <span class="status-val" id="st-x">—</span></span>
    <span class="divider">·</span>
    <span>y <span class="status-val" id="st-y">—</span></span>
    <span class="divider">·</span>
    <span class="status-val" id="st-pts">0 pts</span>
    <span class="divider">·</span>
    <span class="status-val" id="st-tool">Pointer</span>
    <span class="divider">·</span>
    <span class="status-val" id="st-zoom">100%</span>
    <span style="flex:1"></span>
    <span id="st-file" style="color:var(--color-muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;"></span>
  </footer>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Shortcuts modal -->
  <div id="shortcuts-modal" style="display:none;" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Keyboard Shortcuts</span>
        <button class="modal-close" id="shortcuts-close">×</button>
      </div>
      <div id="shortcuts-content" style="padding:14px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0 20px;"></div>
    </div>
  </div>

  <!-- Export modal -->
  <div id="export-modal" style="display:none;" class="modal-backdrop">
    <div class="modal" style="width:400px;">
      <div class="modal-header">
        <span class="modal-title">Export Data</span>
        <button class="modal-close" id="export-modal-close">×</button>
      </div>
      <div class="modal-body" id="export-modal-body"></div>
    </div>
  </div>

  <!-- Delete confirm -->
  <div id="delete-popover" style="display:none;position:fixed;z-index:150;background:var(--color-surface-3);border:1px solid var(--color-border-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);padding:12px 14px;min-width:172px;">
    <p style="font-size:12px;color:var(--color-text);margin-bottom:10px;">Delete this point?</p>
    <div style="display:flex;gap:7px;justify-content:flex-end;">
      <button id="delete-cancel"  class="btn btn-ghost   btn-sm" style="width:auto;">Cancel</button>
      <button id="delete-confirm" class="btn btn-danger  btn-sm" style="width:auto;">Delete</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlotVision</title>

  <!-- Geist fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- PDF.js UMD (sets window.pdfjsLib) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="overflow-hidden h-screen flex flex-col select-none">

  <!-- Topbar -->
  <header id="topbar" class="h-11 border-b border-border bg-surface flex items-center px-3 gap-2 shrink-0 z-50"></header>

  <!-- Three-panel body -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left panel — tool rail -->
    <aside id="left-panel" class="w-13 border-r border-border bg-surface flex flex-col items-center py-2 gap-1 shrink-0 z-40"></aside>

    <!-- Canvas area -->
    <main id="canvas-container" class="flex-1 relative overflow-hidden bg-bg cursor-crosshair">
      <canvas id="main-canvas" class="absolute inset-0"></canvas>
      <canvas id="overlay-canvas" class="absolute inset-0 pointer-events-none"></canvas>

      <!-- Drop overlay (shown when dragging file) -->
      <div id="drop-overlay" class="absolute inset-0 bg-bg/90 border-2 border-dashed border-accent rounded-lg flex flex-col items-center justify-center gap-3 hidden z-20">
        <p class="text-accent text-lg font-medium">Drop image or PDF to load</p>
        <p class="text-muted text-sm">PNG, JPG, BMP, GIF, WebP, TIFF, SVG, PDF</p>
      </div>

      <!-- Empty state (shown when no image loaded) -->
      <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center gap-4 pointer-events-none">
        <p class="text-text text-xl font-medium">No image loaded</p>
        <p class="text-muted text-sm text-center max-w-xs">Drag & drop an image or PDF, paste from clipboard (Ctrl+V), or click Open</p>
        <button id="empty-open-btn" class="pointer-events-auto mt-2 px-4 py-2 bg-accent text-bg text-sm font-medium rounded-sm hover:bg-accent/90 transition-colors">
          Open File
        </button>
      </div>
    </main>

    <!-- Right panel -->
    <aside id="right-panel" class="w-72 border-l border-border bg-surface flex flex-col shrink-0 overflow-hidden z-40"></aside>

  </div>

  <!-- Status bar -->
  <footer id="status-bar" class="h-7 border-t border-border bg-surface flex items-center px-3 gap-4 text-xs text-muted font-mono shrink-0">
    <span id="status-coords">x: —, y: —</span>
    <span class="text-faint">|</span>
    <span id="status-points">0 points</span>
    <span class="text-faint">|</span>
    <span id="status-tool">Pointer</span>
    <span class="text-faint">|</span>
    <span id="status-zoom">100%</span>
    <span class="ml-auto" id="status-filename"></span>
  </footer>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-10 right-4 flex flex-col gap-2 z-[100] pointer-events-none"></div>

  <!-- Keyboard shortcuts modal -->
  <div id="shortcuts-modal" class="fixed inset-0 bg-bg/80 backdrop-blur-sm flex items-center justify-center z-[200] hidden">
    <div class="bg-surface border border-border rounded-md w-[520px] max-h-[80vh] overflow-y-auto">
      <div class="flex items-center justify-between px-4 py-3 border-b border-border">
        <h2 class="text-text font-medium">Keyboard Shortcuts</h2>
        <button id="shortcuts-close" class="text-muted hover:text-text text-lg leading-none">×</button>
      </div>
      <div id="shortcuts-content" class="p-4 grid grid-cols-2 gap-x-6 gap-y-1 text-sm"></div>
    </div>
  </div>

  <!-- Delete confirm popover -->
  <div id="delete-popover" class="fixed bg-surface border border-border rounded-md shadow-lg p-3 flex flex-col gap-2 z-[150] hidden">
    <p class="text-text text-sm">Delete this point?</p>
    <div class="flex gap-2 justify-end">
      <button id="delete-cancel" class="px-3 py-1 text-xs text-muted border border-border rounded-sm hover:text-text">Cancel</button>
      <button id="delete-confirm" class="px-3 py-1 text-xs text-bg bg-red-500 rounded-sm hover:bg-red-400">Delete</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>

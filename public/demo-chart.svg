<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580">
  <!-- Background -->
  <rect width="780" height="580" fill="white"/>

  <!-- Title -->
  <text x="390" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#111">Signal Intensity vs. Concentration</text>
  <text x="390" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">Hill equation fit (n = 3, EC₅₀ = 3 mM)</text>

  <!-- Plot area border -->
  <rect x="80" y="55" width="620" height="475" fill="none" stroke="#999" stroke-width="1"/>

  <!-- Grid lines (light) -->
  <!-- Vertical grid at x = 2, 4, 6, 8 -->
  <line x1="204" y1="55" x2="204" y2="530" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="328" y1="55" x2="328" y2="530" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="452" y1="55" x2="452" y2="530" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="576" y1="55" x2="576" y2="530" stroke="#e8e8e8" stroke-width="1"/>
  <!-- Horizontal grid at y = 10, 20, 30, 40, 50 -->
  <line x1="80" y1="453" x2="700" y2="453" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="376" x2="700" y2="376" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="299" x2="700" y2="299" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="222" x2="700" y2="222" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="145" x2="700" y2="145" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Fitted curve (Hill equation, n=3, EC50=3, Ymax=60) -->
  <!-- Points computed at x=0,0.5,...,10: y=60*x³/(27+x³) -->
  <polyline points="
    80,530
    111,528
    142,514
    173,480
    204,425
    235,365
    266,299
    297,240
    328,205
    359,174
    390,151
    421,133
    452,120
    514,103
    576,93
    638,85
    700,81"
    fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Dataset A — Series 1 (filled circles) -->
  <circle cx="111" cy="511" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="154" cy="493" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="204" cy="412" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="254" cy="321" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="297" cy="224" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="340" cy="188" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="390" cy="139" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="483" cy="113" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="576" cy="88"  r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="700" cy="75"  r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>

  <!-- Dataset B — Series 2 (open squares) -->
  <rect x="122" y="507" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="165" y="451" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="227" y="357" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="270" y="263" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="351" y="170" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="444" y="122" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="537" y="90"  width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="630" y="74"  width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>

  <!-- X axis -->
  <line x1="80" y1="530" x2="700" y2="530" stroke="#333" stroke-width="1.5"/>
  <!-- X ticks -->
  <line x1="80"  y1="530" x2="80"  y2="538" stroke="#333" stroke-width="1.5"/>
  <line x1="204" y1="530" x2="204" y2="538" stroke="#333" stroke-width="1.5"/>
  <line x1="328" y1="530" x2="328" y2="538" stroke="#333" stroke-width="1.5"/>
  <line x1="452" y1="530" x2="452" y2="538" stroke="#333" stroke-width="1.5"/>
  <line x1="576" y1="530" x2="576" y2="538" stroke="#333" stroke-width="1.5"/>
  <line x1="700" y1="530" x2="700" y2="538" stroke="#333" stroke-width="1.5"/>
  <!-- X tick labels -->
  <text x="80"  y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">0</text>
  <text x="204" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">2</text>
  <text x="328" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">4</text>
  <text x="452" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">6</text>
  <text x="576" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">8</text>
  <text x="700" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">10</text>
  <!-- X axis label -->
  <text x="390" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#333">Concentration (mM)</text>

  <!-- Y axis -->
  <line x1="80" y1="55" x2="80" y2="530" stroke="#333" stroke-width="1.5"/>
  <!-- Y ticks -->
  <line x1="72" y1="530" x2="80" y2="530" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="453" x2="80" y2="453" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="376" x2="80" y2="376" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="299" x2="80" y2="299" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="222" x2="80" y2="222" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="145" x2="80" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="72" y1="69"  x2="80" y2="69"  stroke="#333" stroke-width="1.5"/>
  <!-- Y tick labels -->
  <text x="67" y="534" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">0</text>
  <text x="67" y="457" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">10</text>
  <text x="67" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">20</text>
  <text x="67" y="303" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">30</text>
  <text x="67" y="226" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">40</text>
  <text x="67" y="149" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">50</text>
  <text x="67" y="73"  text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#333">60</text>
  <!-- Y axis label -->
  <text x="18" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#333" transform="rotate(-90,18,292)">Signal Intensity (AU)</text>

  <!-- Legend -->
  <rect x="560" y="420" width="128" height="68" rx="4" fill="white" stroke="#ccc" stroke-width="1"/>
  <circle cx="578" cy="440" r="5" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <text x="590" y="444" font-family="Arial, sans-serif" font-size="11" fill="#333">Series A (n=10)</text>
  <rect x="573" y="456" width="10" height="10" rx="1" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">Series B (n=8)</text>
  <line x1="573" y1="482" x2="588" y2="482" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="590" y="486" font-family="Arial, sans-serif" font-size="11" fill="#333">Hill fit</text>
</svg>
